<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="jr-token" content="__JR_TOKEN__">
  <title>Job Radar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b1b18'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%238b93ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='none' stroke='%238b93ff' stroke-width='2'/%3E%3Ccircle cx='22' cy='10' r='2.5' fill='%23ff8a4c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css?v=__JR_VERSION__">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" />
        <circle cx="16" cy="16" r="9.5" />
        <circle cx="16" cy="16" r="4.5" />
        <path d="M16 16 L16 6.5 A9.5 9.5 0 0 1 24.2 11.2 Z" class="sweep" />
        <circle cx="22.5" cy="10" r="2.2" class="blip" />
      </svg>
      <span class="brand-name">Job Radar</span>
    </div>

    <nav class="nav" aria-label="主要">
      <button class="nav-item" data-nav="radar">推薦職缺<span class="nav-count" id="nav-radar-count"></span></button>
      <button class="nav-item" data-nav="apps">我的申請<span class="nav-count" id="nav-apps-count"></span></button>
    </nav>

    <div class="topbar-actions">
      <button id="add-open" class="btn ghost"><span class="plus" aria-hidden="true">＋</span>加入職缺網址</button>
      <button id="health-btn" class="health" popovertarget="health-pop" aria-label="資料狀態">
        <span class="health-dot"></span><span id="health-text">讀取中</span>
      </button>
      <div id="health-pop" class="popover" popover>
        <p class="popover-title">申請資料</p>
        <ul id="health-list" class="health-list"></ul>
        <p class="popover-foot">在 <code>profile/</code> 修改；草稿模型在 <code>.env</code> 設定金鑰。</p>
      </div>
    </div>
  </header>

  <main id="view-radar" class="view radar-view" hidden></main>

  <main id="view-apps" class="view apps-view" hidden>
    <aside class="list-col">
      <form id="add-form" class="composer">
        <textarea id="url-input" rows="1" placeholder="貼上職缺網址，可以一次貼好幾個"></textarea>
        <button id="add-btn" class="btn primary" type="submit">加入</button>
      </form>
      <p id="add-msg" class="composer-msg" aria-live="polite"></p>
      <div class="segmented" role="tablist" aria-label="篩選">
        <button class="seg active" data-filter="active" role="tab">進行中</button>
        <button class="seg" data-filter="done" role="tab">已送出</button>
        <button class="seg" data-filter="all" role="tab">全部</button>
      </div>
      <div id="job-list" class="job-list"></div>
    </aside>

    <section id="detail" class="detail"></section>
  </main>

  <template id="radar-art">
    <svg class="radar-art" viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="92" />
      <circle cx="100" cy="100" r="64" />
      <circle cx="100" cy="100" r="36" />
      <path d="M100 8 V192 M8 100 H192" class="axis" />
      <path d="M100 100 L100 8 A92 92 0 0 1 179.7 54 Z" class="sweep" />
      <circle cx="142" cy="58" r="6" class="blip" />
      <circle cx="62" cy="128" r="4" class="blip dim" />
      <circle cx="128" cy="140" r="3" class="blip dim" />
    </svg>
  </template>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/common.js?v=__JR_VERSION__"></script>
  <script src="/static/app.js?v=__JR_VERSION__"></script>
</body>
</html>
