<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>Job Radar</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { font: 13px/1.6 -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif; background: #f6f6f3; color: #1a1a17; }
    @media (prefers-color-scheme: dark) { body { background: #0f0f11; color: #ececee; } #offline { background: #17171a; border-color: #26262b; } }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
    #offline { margin: 16px 14px; padding: 14px 16px; border: 1px solid #e6e5df; border-radius: 12px; background: #fff; }
    #offline p { margin: 0 0 6px; }
    code { font: 11.5px ui-monospace, "SF Mono", Menlo, monospace; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <iframe id="jr" title="Job Radar"></iframe>
  <div id="offline" hidden>
    <p><strong>申請助手沒有在執行。</strong></p>
    <p>點 Dock 上的 Job Radar，或在終端機執行 <code>uv run job-radar ui</code>。</p>
  </div>
  <script src="config.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
