[project]
name = "job-radar"
version = "0.1.0"
description = "Personal job radar and semi-automated application assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.1",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.28",
    "playwright>=1.50",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "rich>=13.9",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.scripts]
job-radar = "job_radar.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_radar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "browser: needs a local Chrome/Chromium (skipped when unavailable)",
]
