# 職缺網站（不登入）。結果會和 ATS 職缺比對：對得到就用 ATS 申請頁（能自動填），
# 對不到的列成「需要自己開啟」。遇到 429、登入頁或驗證頁就停止該網站，記在抓取結果裡。
# 這是共用設定；個人的設定（要不要用某個網站、自己指定關鍵字）寫在 profile/sources.yaml。
#
# 搜尋關鍵字：預設用 filters.yaml 裡「你看的職務類別」各自的 queries（每類先搜第一個，再搜第二個），
# 所以選了方向（only_roles）就會搜對應的關鍵字。在 profile/sources.yaml 寫 queries 就改用你列的。
location: United States
days: 7                 # 只看最近幾天發布的

linkedin:
  enabled: true
  pages_per_query: 2    # 一頁 10 筆
  delay_seconds: [3, 8] # 每個請求之間隨機等待；LinkedIn 連續請求很快就 429

jobright:
  enabled: true
  delay_seconds: [5, 10] # 每個關鍵字一個請求、一次 20 筆；連續太多次會被擋

# Simplify 在 GitHub 公開整理的職缺清單：不用關鍵字，每個 repo 一次下載整份（不登入）。
# 連結直接是公司的申請頁，Greenhouse / Lever / Ashby 的能自動填，其他（Workday 等）列在
# 「需要自己開啟」。也想看實習就加上 SimplifyJobs/Summer2026-Internships（只會留下 co-op /
# off-cycle，除非在 profile/filters.yaml 改了 levels）。
simplify:
  enabled: true
  delay_seconds: [1, 2]
  repos:
    - SimplifyJobs/New-Grad-Positions
