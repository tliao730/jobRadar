# 職缺雷達的篩選與評分規則。比對不分大小寫，都是 regex（\b 是字邊界）。
# 這是大家共用的預設（在 git 裡）；個人不同的部分寫在 profile/filters.yaml，只寫要改的設定。

# 職務類別：職稱符合 titles 任一條就屬於該類別（由上而下第一個符合的為準）。
# name 是推薦頁上顯示的名稱；weight 是偏好（0–1）；enabled: false 整類不看。
# 只想看其中幾類（例如找硬體的人），在 profile/filters.yaml 寫 only_roles: [hardware, embedded]，
# 沒列到的都不看，不用一類一類關掉。這裡沒有的類別也可以在 profile/filters.yaml 新增。
roles:
  - {id: mle, name: MLE, weight: 1.0, titles: ['machine learning', '\bml\b', 'mlops', 'applied scientist', '\bai/ml\b']}
  - {id: ai_engineer, name: AI Engineer, weight: 0.9, titles: ['\bai engineer', '\bllm\b', 'generative ai', '\bgenai\b', 'ai research']}
  - {id: ds, name: Data Science, weight: 1.0, titles: ['data scien', 'research scientist', 'quantitative (analyst|researcher)', 'decision scien', 'statistician']}
  - {id: de, name: Data Eng, weight: 0.7, titles: ['data engineer', 'analytics engineer', 'data platform', 'data infrastructure']}
  - {id: da, name: Analyst, weight: 0.6, titles: ['data analyst', 'business intelligence', 'product analyst', 'analytics analyst', '\bbi (analyst|engineer)']}
  # 硬體方向：預設不看，找硬體的人用 only_roles 打開（放在 swe 前面，Embedded Software Engineer 才會歸到 embedded）。
  - {id: hardware, name: Hardware, weight: 1.0, enabled: false, titles: ['\bhardware\b', 'electrical', '\basic\b', '\bfpga\b', '\brtl\b', 'verification engineer', '(design|hardware|silicon|asic) verification', '(hardware|silicon|post-silicon|product) validation', 'physical design', '(?<!non[- ])\bsilicon\b', '\bsoc\b', 'analog', 'mixed[- ]signal', 'circuit', 'semiconductor', '\bpcb\b', 'board design', '\bdft\b', 'signal integrity', '\brf\b', 'photonics', '\bpower electronics\b']}
  - {id: embedded, name: Embedded, weight: 1.0, enabled: false, titles: ['embedded', 'firmware']}
  - {id: swe, name: SWE, weight: 0.5, titles: ['software engineer', 'software developer', 'backend', 'back-end', 'full[- ]?stack', 'member of technical staff']}

# 職稱含這些字就不看（業務、管理職等）。
# 最後一條：職稱寫 PhD 但沒寫 MS / Master 的（只收博士生）。
exclude_titles: ['^(?!.*\b(ms|m\.s\.|masters?|bs|bachelor)\b).*\bph\.?d\b', '\bsales\b', 'recruit', 'account (executive|manager)', '\bdirector\b', '\bvp\b', 'vice president', '\bhead of\b', '\bmanager\b', 'counsel', 'marketing', 'customer success', 'solutions? (architect|engineer)']

# 層級（看職稱，以及 LinkedIn / Jobright 標的層級）：exclude 的直接排除；boost 的加分。
# 2027 年 5 月畢業：以 new grad / entry level 為主；實習只要 co-op 或 off-cycle（intern_requires）。
levels:
  exclude: ['\bsenior\b', '\bsr\.?\b', '\bstaff\b', '\bprincipal\b', '\blead\b', '\bdistinguished\b', '\bII\b', '\bIII\b', '\bIV\b', '\b[3-9]\b', '\bmid[- ]level\b']
  boost:
    intern: ['\bintern(ship)?\b', '\bco-?op\b']
    new_grad: ['new grad', 'university grad', 'recent grad', 'early career', 'entry[- ]level', '\bjunior\b', '\bassociate\b', '\bI\b', 'graduate', 'class of 20\d\d']
  # 想找什麼：intern、new_grad、any（不限，但沒有加分）
  want: [new_grad]
  # 實習要符合其中一條才保留：intern_requires 看職稱，intern_requires_in_jd 看 JD
  # （JD 裡的季節常是在講學期，例如 "returning to school in fall 2027"，所以只在職稱裡算）。
  # 兩個都留空 = 所有實習都保留。
  intern_requires: ['\bco-?op\b', 'off[- ]cycle', '\b(fall|spring|winter|autumn)\b']
  intern_requires_in_jd: ['\bco-?op\b', 'off[- ]cycle']
  # JD 要求的最低年資超過這個數字就排除（例如 "3+ years of experience"）
  max_years: 2

# 地點：符合 include 且不符合 exclude 才保留；列多個地點（用 ; | / • 分隔）時有一個符合就保留。
# 地點空白的保留。
locations:
  include: ['united states', '\busa?\b', '\bremote\b', 'new york', '\bny\b', 'san francisco', 'bay area', 'seattle', 'los angeles', 'boston', 'austin', 'chicago', 'mountain view', 'palo alto', 'menlo park', 'sunnyvale', 'san jose', 'san mateo', 'redwood city', 'oakland', 'denver', 'atlanta', 'washington', ', (ca|ny|wa|ma|tx|il|co|ga|nj|pa|or|nc|va|ut|az|fl|mn|mi|oh|md|dc)\b']
  exclude: ['canada', 'united kingdom', '\buk\b', 'london', 'india', 'singapore', 'germany', 'ireland', 'dublin', 'japan', 'brazil', 'mexico', 'poland', 'netherlands', 'australia', 'toronto', 'remote.{0,10}(canada|uk|emea|europe|apac|latam)']

# JD 寫明不提供 sponsorship 的直接排除（不需要 sponsorship 的人在 profile/filters.yaml 把
# exclude_no_sponsorship 設成 false）。
sponsorship:
  exclude_no_sponsorship: true
  no_sponsorship: ['(not|unable to|cannot|can.t|will not|won.t|do not|does not) (be able to )?(offer|provide|support|sponsor)[^.]{0,40}(sponsorship|visa)', 'without (the )?(need for )?(current or future )?(visa )?sponsorship', 'no (visa )?sponsorship', 'must be (a )?u\.?s\.? citizen', 'security clearance', 'citizenship is required']

# 分數 = 各項加權平均（0–100）。層級權重高，是因為沒寫層級的職缺多半要求經驗。
weights: {skills: 0.4, role: 0.25, level: 0.35}
max_age_days: 60     # 發布超過這麼多天的不推薦（抓不到發布日期的照推）
